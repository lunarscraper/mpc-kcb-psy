name: test

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phasentest + Demo-WAV
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: kcb-demo
          path: build/kcb_demo_145bpm_F.wav

  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: port }
      - uses: actions/checkout@v4
        with:
          repository: sd88me/mpc-vst-plugins
          ref: f373ae9c29ab1ad977c7ac1eaf59afa808db91f5
          path: mpc-vst-plugins
      - name: Wrapper-Hosttest (x86, ASan/UBSan)
        working-directory: port
        run: ../mpc-vst-plugins/tools/test_port.sh vst/vst.json
