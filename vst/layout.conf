# KCB Psy – Skin-Layout (Force-Shadow-Syntax, siehe mpc-vst-plugins docs/SKIN_STUDIO.md)
# Theme: dunkles UV/Neon, bewusst gewählt (keine Shadow-Page als Vorlage vorhanden)
# Live-Text von MPC (Reglernamen + Werte) größer. Titel, Gruppen- und Optionstexte kommen über
# "title_font" in vst.json (Titillium Web, OFL, vst/fonts/) statt des kleinen 8x8-Bitmapfonts.
label_scale=1.35
theme_bg=0e0b16
theme_panel=171226
theme_line=2c2345
theme_ink=ece6ff
theme_ink_dim=9a8fc0
theme_ink_faint=5d5480
theme_accent=b14cff
theme_accent_hi=d68bff
theme_knob_face=e6dcff
theme_knob_ring=2c2345
theme_knob_dot=39ffb0
theme_bar=08060e
theme_tab_on=2a1845
theme_tab_on_tx=f3ecff
theme_seg_active=39ffb0
theme_seg_inactive=08060e
theme_seg_active_tx=0e0b16

[tab KICK / BASS]
frame x=10 y=92 w=1258 h=304 title="KICK"
knob cx=87 cy=222 r=36 label="PITCH" key=kick_pitch
knob cx=245 cy=222 r=36 label="SWEEP" key=kick_sweep
knob cx=403 cy=222 r=36 label="DECAY" key=kick_decay
knob cx=561 cy=222 r=36 label="CLICK" key=kick_click
knob cx=719 cy=222 r=36 label="DRIVE" key=kick_drive
knob cx=877 cy=222 r=36 label="KICK LVL" key=kick_level
knob cx=1035 cy=222 r=36 label="GAP" key=gap
knob cx=1193 cy=222 r=36 label="TEMPO" key=bpm
frame x=10 y=404 w=1258 h=304 title="BASS"
knob cx=87 cy=534 r=36 label="CUTOFF" key=bass_cutoff
knob cx=245 cy=534 r=36 label="RESO" key=bass_reso
knob cx=403 cy=534 r=36 label="ENV MOD" key=bass_envmod
knob cx=561 cy=534 r=36 label="DECAY" key=bass_decay
knob cx=719 cy=534 r=36 label="BASS LVL" key=bass_level
enum_v cx=877 cy=544 label="PATTERN" key=pattern
frame x=962 y=436 w=146 h=160 title="TONART"
popup cx=1035 cy=544 w=126 h=48 label="" key=root
enum_v cx=1193 cy=512 label="PHASE LOCK" key=lock
qlinks "KICK / BASS" = kick_pitch,kick_sweep,kick_decay,kick_click,kick_drive,kick_level,gap,bpm,bass_cutoff,bass_reso,bass_envmod,bass_decay,bass_level,pattern,root,lock

[tab SETUP]
frame x=10 y=92 w=784 h=304 title="SETUP"
enum_v cx=87 cy=270 label="OKTAVE" key=octave
enum_v cx=245 cy=270 label="KEY FOLLOW" key=key_follow
enum_v cx=403 cy=270 label="SYNC" key=sync
enum_v cx=561 cy=302 label="PATTERN" key=pattern
enum_v cx=719 cy=270 label="PHASE LOCK" key=lock
qlinks "SETUP" = octave,key_follow,sync,pattern,lock
